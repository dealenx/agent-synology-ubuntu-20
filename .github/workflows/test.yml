name: test

on:
  push:
  workflow_dispatch:

jobs:
  install-script:
    runs-on: ubuntu-latest
    # native ubuntu-20.04 runners were removed by GitHub (2025-04);
    # a bare focal container is the real target environment
    container: ubuntu:20.04
    steps:
      - name: Install git for checkout (bare focal has none)
        run: apt-get update -qq && apt-get install -y -qq git
      - uses: actions/checkout@v4
      - name: Reproduce headers failure + run install-abb.sh
        run: bash verify.sh
